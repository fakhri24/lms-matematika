<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Siswa - Albago Learning</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container" style="margin-top: 80px">
      <div class="question-card" style="max-width: 400px; margin: 0 auto">
        <div class="text-center mb-25">
          <h2 class="text-primary">Selamat Datang</h2>
          <p class="status-text">Gunakan NIS untuk masuk ke latihan</p>
        </div>

        <p
          id="pesan-error"
          class="info-box box-danger text-center mb-15"
          style="display: none; padding: 10px"
        ></p>

        <div class="options-container">
          <div class="mb-15">
            <label class="font-semibold mb-5" style="display: block"
              >Nomor Induk Siswa (NIS)</label
            >
            <input
              type="number"
              id="nis-input"
              class="option-label w-100"
              style="border: 2px solid var(--border-color); cursor: text"
              placeholder="Contoh: 2024001"
            />
          </div>

          <div class="mb-20">
            <label class="font-semibold mb-5" style="display: block"
              >Kata Sandi</label
            >
            <input
              type="password"
              id="pass-input"
              class="option-label w-100"
              style="border: 2px solid var(--border-color); cursor: text"
              placeholder="******"
            />
          </div>

          <button
            id="btn-login"
            class="btn btn-primary w-100"
            style="padding: 15px"
          >
            Masuk ke Aplikasi
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="js/auth.js"></script>
  </body>
</html>
